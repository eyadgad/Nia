[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nia-whisper-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.41",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "websockets>=14.0",
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
