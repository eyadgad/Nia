services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env file}
    ports:
      - "5432:5432"
    volumes:
      - nia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      ASSISTANT_MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env file}@postgres:5432/${POSTGRES_DB:-nia}
      ASSISTANT_DATABASE_URL: postgresql://assistant_runtime:${ASSISTANT_RUNTIME_PASSWORD:?Set ASSISTANT_RUNTIME_PASSWORD in the untracked .env file}@postgres:5432/${POSTGRES_DB:-nia}
      ASSISTANT_RUNTIME_PASSWORD: ${ASSISTANT_RUNTIME_PASSWORD:?Set ASSISTANT_RUNTIME_PASSWORD in the untracked .env file}
      ASSISTANT_MIGRATOR_PASSWORD: ${ASSISTANT_MIGRATOR_PASSWORD:?Set ASSISTANT_MIGRATOR_PASSWORD in the untracked .env file}
      APPLY_APP_STUBS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.db.migrate"]

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      ASSISTANT_DATABASE_URL: postgresql://assistant_runtime:${ASSISTANT_RUNTIME_PASSWORD:?Set ASSISTANT_RUNTIME_PASSWORD in the untracked .env file}@postgres:5432/${POSTGRES_DB:-nia}
      ASSISTANT_MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env file}@postgres:5432/${POSTGRES_DB:-nia}
      FRONTEND_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
      AUTH_ADAPTER: standalone
      STANDALONE_DEMO_ALLOWED_FILE_IDS: "49,91,93,94"
      STANDALONE_DEMO_CAN_USE_PRIVATE_FILES: "true"
      WHISPER_SERVICE_URL: http://whisper:8090
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_HEALTH_URL: http://livekit:7880
      REASONING_PROVIDER: ${REASONING_PROVIDER:-http}
      REASONING_BASE_URL: ${REASONING_BASE_URL:-}
      REASONING_MODEL: ${REASONING_MODEL:-grok-4.20-0309-non-reasoning}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.0}
      PLANNER_MODE: ${PLANNER_MODE:-ai}
      WHOLE_LIST_ANSWER: ${WHOLE_LIST_ANSWER:-false}
      PLANNER_SELF_REVIEW: ${PLANNER_SELF_REVIEW:-true}
    volumes:
      - ../backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      whisper:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.5
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in the untracked .env file}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in the untracked .env file}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  agent:
    build:
      context: ../backend
      args:
        INSTALL_VOICE: "true"
    # Host networking so the agent reaches LiveKit's advertised 127.0.0.1 ICE
    # candidates (and Postgres/whisper) through the same published host ports the
    # browser uses. This keeps a single consistent media address for both peers.
    network_mode: host
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      ASSISTANT_DATABASE_URL: postgresql://assistant_runtime:${ASSISTANT_RUNTIME_PASSWORD:?Set ASSISTANT_RUNTIME_PASSWORD in the untracked .env file}@127.0.0.1:5432/${POSTGRES_DB:-nia}
      WHISPER_SERVICE_URL: http://127.0.0.1:8090
      LIVEKIT_URL: ws://127.0.0.1:7880
      TTS_PROVIDER: ${TTS_PROVIDER:-xai}
      REASONING_PROVIDER: ${REASONING_PROVIDER:-http}
      REASONING_BASE_URL: ${REASONING_BASE_URL:-}
      REASONING_MODEL: ${REASONING_MODEL:-grok-4.20-0309-non-reasoning}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.0}
      PLANNER_MODE: ${PLANNER_MODE:-ai}
      WHOLE_LIST_ANSWER: ${WHOLE_LIST_ANSWER:-false}
      PLANNER_SELF_REVIEW: ${PLANNER_SELF_REVIEW:-true}
    command: ["python", "-m", "app.realtime.worker", "start"]
    depends_on:
      livekit:
        condition: service_started
      whisper:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  whisper:
    build:
      context: ../services/whisper
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-Nia (pronounced nee-uh) is a research assistant and is normally written Nia. Users may spell names and words one letter at a time.}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-Nia, hi, hello, hey}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-false}
      WHISPER_PORT: "8090"
      WHISPER_MAX_CONCURRENT_SESSIONS: "4"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nia_pg_data:
